<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>First Meal — Shopping list</title>
<meta name="description" content="A shopping list from First Meal. Tick things off as you shop; the list lives inside the link.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="First Meal">
<meta property="og:title" content="Shopping list">
<meta property="og:description" content="Tick things off as you shop. Made with First Meal.">
<meta property="og:url" content="https://boyantasevski.github.io/first-meal-site/list.html">
<meta property="og:image" content="https://boyantasevski.github.io/first-meal-site/img/og/list.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="First Meal shopping list">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Shopping list">
<meta name="twitter:description" content="Tick things off as you shop. Made with First Meal.">
<meta name="twitter:image" content="https://boyantasevski.github.io/first-meal-site/img/og/list.jpg">
<style>
  :root { color-scheme: light dark; --ink: #000; --ink2: #6e6e73; --bg: #fff; --tile: #f2f2f7; --line: #e5e5ea; --accent: #0a84ff; --ok: #34c759; }
  @media (prefers-color-scheme: dark) { :root { --ink: #fff; --ink2: #98989d; --bg: #000; --tile: #1c1c1e; --line: #2c2c2e; --ok: #30d158; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin: 0 0 6px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 4px; letter-spacing: -.01em; }
  .dates { color: var(--ink2); margin: 0 0 20px; }
  .progress { color: var(--ink2); font-size: 15px; margin: 0 0 16px; font-variant-numeric: tabular-nums; }
  section.shop { background: var(--tile); border-radius: 20px; padding: 14px 16px 6px; margin: 0 0 16px; }
  section.shop h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin: 0 0 6px; }
  h3 { font-size: 15px; font-weight: 600; color: var(--ink2); margin: 14px 0 2px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li label { display: flex; gap: 12px; align-items: flex-start; flex: 1; cursor: pointer; min-width: 0; }
  input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ink2); margin: 2px 0 0; flex: none; display: grid; place-items: center; background: transparent; }
  input[type=checkbox]:checked { background: var(--ok); border-color: var(--ok); }
  input[type=checkbox]:checked::after { content: ""; width: 7px; height: 12px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  input[type=checkbox]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .name { font-weight: 600; }
  .meta { color: var(--ink2); font-size: 14px; }
  li.done .name { text-decoration: line-through; color: var(--ink2); }
  .foot { color: var(--ink2); font-size: 14px; margin: 20px 0 0; }
  .foot a { color: var(--accent); text-decoration: none; }
  .empty { padding: 48px 0; color: var(--ink2); text-align: center; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 18px; background: var(--ink); color: var(--bg); margin: 8px 0 0; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <p class="brand">First Meal · Shopping list</p>
  <h1 id="title">Shopping list</h1>
  <p class="dates" id="dates"></p>
  <p class="progress" id="progress"></p>
  <div id="list"></div>
  <p class="foot" id="freezer"></p>
  <p class="foot">Tick things off as you shop; the ticks stay on this phone. The list is inside the link, so nothing is stored anywhere else. <a href="index.html">About First Meal</a></p>
</main>
<script>
(function () {
  function decode(frag) {
    if (!frag) return null;
    var s = frag.replace(/^#/, '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    try {
      var bytes = atob(s);
      var utf8 = decodeURIComponent(Array.prototype.map.call(bytes, function (c) { return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
      return JSON.parse(utf8);
    } catch (e) { return null; }
  }
  var data = decode(location.hash);
  var listEl = document.getElementById('list');
  if (!data || !data.shops) {
    document.getElementById('dates').textContent = '';
    listEl.innerHTML = '<p class="empty">This link has no list in it. Ask for it to be sent again from First Meal.</p>';
    document.getElementById('progress').textContent = '';
    return;
  }
  var key = 'fm-list-' + (data.id || 'x');
  var ticks = {};
  try { ticks = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { ticks = {}; }
  function save() { try { localStorage.setItem(key, JSON.stringify(ticks)); } catch (e) {} }
  document.getElementById('title').textContent = data.title || 'Shopping list';
  document.getElementById('dates').textContent = data.dates || '';
  var total = 0, items = [];
  data.shops.forEach(function (shop, si) {
    var sec = document.createElement('section'); sec.className = 'shop';
    var h2 = document.createElement('h2'); h2.textContent = shop.t || ('Shop ' + (si + 1)); sec.appendChild(h2);
    (shop.a || []).forEach(function (aisle, ai) {
      var h3 = document.createElement('h3'); h3.textContent = aisle.n || ''; sec.appendChild(h3);
      var ul = document.createElement('ul');
      (aisle.i || []).forEach(function (it, ii) {
        var id = si + ':' + ai + ':' + ii + ':' + (it.n || '');
        total++;
        var li = document.createElement('li'); if (ticks[id]) li.className = 'done';
        var label = document.createElement('label');
        var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!ticks[id]; cb.setAttribute('aria-label', it.n || '');
        cb.addEventListener('change', function () { if (cb.checked) ticks[id] = 1; else delete ticks[id]; li.className = cb.checked ? 'done' : ''; save(); progress(); });
        var text = document.createElement('div');
        var name = document.createElement('div'); name.className = 'name'; name.textContent = (it.n || '') + (it.q ? ' · ' + it.q : '');
        var meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = it.d || '';
        text.appendChild(name); if (it.d) text.appendChild(meta);
        label.appendChild(cb); label.appendChild(text); li.appendChild(label); ul.appendChild(li);
        items.push(id);
      });
      sec.appendChild(ul);
    });
    listEl.appendChild(sec);
  });
  function progress() { var done = items.filter(function (id) { return ticks[id]; }).length; document.getElementById('progress').textContent = done + ' of ' + total + ' bought'; }
  progress();
  if (data.frz && data.frz.length) document.getElementById('freezer').textContent = 'Already in the freezer, not on the list: ' + data.frz.join(', ') + '.';
})();
</script>
</body>
</html>
